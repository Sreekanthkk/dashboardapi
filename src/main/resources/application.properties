spring.application.name=dashboardapi

# Server port (separate from homemanagementapi on 8080)
server.port=8081

# Context path
server.servlet.context-path=/api/admin

# MySQL - connects to the same homemanagement database
spring.datasource.url=jdbc:mysql://localhost:3306/homemanagement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Dhyan1978*
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate - read-only, never alter the schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS - allow requests from the admin UI
app.cors.allowed-origins=http://localhost:3001
